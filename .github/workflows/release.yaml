name: "Release"

on:
  push:
    tags:
      - "*.*.*"
  release:
    types:
      - "published"

permissions:
  contents: write

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"

      - name: "Validate manifest version"
        shell: "bash"
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = Path("custom_components/bms_ble/manifest.json")
          version = json.loads(manifest.read_text())["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[a-z]+\d+)?", version):
              raise SystemExit(f"Invalid Home Assistant manifest version: {version}")
          PY

      - name: "Generate .zip"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/bms_ble"
          zip bms_ble.zip -r ./

      - name: "Upload .zip to the release"
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: ${{ github.workspace }}/custom_components/bms_ble/bms_ble.zip
